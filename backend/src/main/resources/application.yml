server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
spring:
  application:
    name: interview-copilot-backend
  main:
    web-application-type: servlet
  datasource:
    url: ${COPILOT_DATABASE_URL:jdbc:postgresql://localhost:5432/interview_copilot}
    username: ${COPILOT_DATABASE_USERNAME:}
    password: ${COPILOT_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SET TIME ZONE 'Asia/Shanghai'"
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
copilot:
  platform:
    master-key: ${COPILOT_PLATFORM_MASTER_KEY:}
  auth:
    email:
      enabled: ${COPILOT_EMAIL_REGISTRATION_ENABLED:true}
      code-secret: ${COPILOT_EMAIL_CODE_SECRET:}
      code-ttl-seconds: ${COPILOT_EMAIL_CODE_TTL_SECONDS:600}
      resend-seconds: ${COPILOT_EMAIL_RESEND_SECONDS:60}
      hourly-send-limit: ${COPILOT_EMAIL_HOURLY_SEND_LIMIT:5}
      maximum-attempts: ${COPILOT_EMAIL_MAXIMUM_ATTEMPTS:5}
      ip-hourly-send-limit: ${COPILOT_EMAIL_IP_HOURLY_SEND_LIMIT:20}
      ip-registration-limit: ${COPILOT_EMAIL_IP_REGISTRATION_LIMIT:30}
    admin:
      bootstrap-username: ${COPILOT_ADMIN_BOOTSTRAP_USERNAME:}
      bootstrap-password: ${COPILOT_ADMIN_BOOTSTRAP_PASSWORD:}
    token-hours: ${COPILOT_TOKEN_HOURS:24}
    login-burst: ${COPILOT_LOGIN_BURST:10}
    login-window-seconds: ${COPILOT_LOGIN_WINDOW_SECONDS:60}
    bootstrap-username: ${COPILOT_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${COPILOT_BOOTSTRAP_PASSWORD:}
  limits:
    max-asr-session-seconds: ${COPILOT_MAX_ASR_SESSION_SECONDS:3600}
