appId: local.interview.copilot
productName: 掌灯 Rewick
artifactName: Rewick-${version}-${os}-${arch}.${ext}
electronFuses:
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
directories:
  output: ../dist
files:
  - out/**/*
  - package.json
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dir
      arch: arm64
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
    LSMinimumSystemVersion: '14.2'
    NSAudioCaptureUsageDescription: 采集会议软件播放的声音，用于你启动的实时转写或面试录音。
    NSMicrophoneUsageDescription: 当你选择麦克风输入或启动面试录音时，采集你的声音。
    NSScreenCaptureUsageDescription: 选择系统音频来源，用于实时转写或你启动的面试录音；应用不保存屏幕画面。
dmg:
  title: 掌灯 Rewick
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
# 常规向导式安装（可选目录），更符合 Windows 用户习惯；改 oneClick: true 可回到双击直装
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Rewick-${version}-win-${arch}-setup.${ext}

extraResources:
  - from: src/renderer/src/assets/interviewer-3d/README.md
    to: licenses/interviewer-3d.md
  - from: build/python-runtime/python
    to: python
  - from: scripts/recording-review.py
    to: recording-review.py
  - from: build/asr-model
    to: asr-model
