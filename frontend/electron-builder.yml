appId: local.interview.copilot
productName: 掌灯 Rewick
artifactName: Rewick-${version}-${os}-${arch}.${ext}
electronFuses:
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
directories:
  output: ../dist
files:
  - out/**/*
  - package.json
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dir
      arch: arm64
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    LSMinimumSystemVersion: '14.2'
    NSAudioCaptureUsageDescription: 采集会议软件播放的声音，用于你启动的实时面试转写。
    NSMicrophoneUsageDescription: 当你选择麦克风输入时，将声音用于实时语音转写。
    NSScreenCaptureUsageDescription: 选择系统音频来源，用于实时语音转写；应用不保存屏幕画面。
dmg:
  title: 掌灯 Rewick
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
# 常规向导式安装（可选目录），更符合 Windows 用户习惯；改 oneClick: true 可回到双击直装
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Rewick-${version}-win-${arch}-setup.${ext}
