name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to supplement with a Windows installer'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '{"include":[{"name":"Windows x64 NSIS","os":"windows-2025","platform":"win","arch":"x64","extension":"exe","suffix":"-setup"}]}' || '{"include":[{"name":"macOS arm64 DMG","os":"macos-15","platform":"mac","arch":"arm64","extension":"dmg","suffix":""},{"name":"Windows x64 NSIS","os":"windows-2025","platform":"win","arch":"x64","extension":"exe","suffix":"-setup"}]}') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$RELEASE_TAG" = "v$(node -p "require('./frontend/package.json').version")"
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          echo "ASSET=Rewick-${RELEASE_TAG#v}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.suffix }}.${{ matrix.extension }}" >> "$GITHUB_ENV"
      - run: npm --prefix frontend ci
      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
      - name: Build Windows installer with native archive tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Git Bash prepends GNU tar, which cannot extract wheel ZIP archives.
          $env:PATH = "$env:SystemRoot\System32;$env:PATH"
          & "$env:SystemRoot\System32\tar.exe" --version
          npm --prefix frontend run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
      - name: Verify macOS package
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          codesign --verify --deep --strict "dist/mac-arm64/掌灯 Rewick.app"
          hdiutil verify "dist/$ASSET"
      - name: Install and launch Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $PWD "dist/$env:ASSET"
          $installDir = Join-Path $env:RUNNER_TEMP 'RewickInstall'
          $env:COPILOT_USER_DATA = Join-Path $env:RUNNER_TEMP 'RewickSmokeProfile'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited $($setup.ExitCode)" }
          $binary = Join-Path $installDir '掌灯 Rewick.exe'
          if (!(Test-Path $binary)) { throw 'Installed executable is missing' }
          $version = (Get-Item $binary).VersionInfo.ProductVersion
          if ($version -ne $env:RELEASE_TAG.Substring(1)) { throw "Installed version mismatch: $version" }
          $bytes = [IO.File]::ReadAllBytes($binary)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw 'Installed app is not x64' }
          & (Join-Path $installDir 'resources/python/python.exe') -c 'import faster_whisper, ctranslate2; print("Bundled speech runtime imports passed")'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled speech runtime failed' }
          Get-Process | Where-Object { $_.Path -eq $binary } | Stop-Process -Force
          $app = Start-Process -FilePath $binary -PassThru
          try {
            $visible = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "App exited before showing a window: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { $visible = $true; break }
            }
            if (!$visible) { throw 'Installed app did not show a window' }
            Write-Output 'PASS: Windows x64 installer, installed version, speech runtime and app window'
          } finally {
            Get-Process | Where-Object { $_.Path -eq $binary } | Stop-Process -Force
          }
      - name: Create package checksum
        run: |
          node --input-type=module <<'JS'
          import { createReadStream } from 'node:fs'
          import { writeFile } from 'node:fs/promises'
          import { createHash } from 'node:crypto'
          const name = process.env.ASSET
          const hash = createHash('sha256')
          for await (const chunk of createReadStream(`dist/${name}`)) hash.update(chunk)
          await writeFile(`dist/${name}.sha256`, `${hash.digest('hex')}  ${name}\n`)
          JS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish verified installers
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - name: Verify downloaded build artifacts
        working-directory: installers
        run: |
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
      - name: Publish or supplement release without overwriting assets
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$BACKFILL" = true ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft == false' | grep -qx true
            gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
            node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises'
          const path = `${process.env.RUNNER_TEMP}/notes.md`
          const body = (await readFile(path, 'utf8')).replace('Windows 安装包尚未验证，不在本次发布范围内。', '')
          await writeFile(path, body + '\n\nWindows x64 NSIS 安装包已补齐，通过 Windows runner 自动安装、版本、内置语音运行时及窗口启动检查。未使用 Windows 代码签名证书，真实音频设备仍需在目标电脑验收。Windows 校验值见对应的 .exe.sha256 文件。\n')
          JS
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo 'Release already exists; refusing to overwrite it.' >&2
              exit 1
            fi
            cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          包含 macOS arm64 DMG（macOS 14.2+）和 Windows x64 NSIS 安装包。各包附带 .sha256 校验文件。

          macOS 未完成 Apple Developer 正式签名与公证；Windows 未使用代码签名证书。Windows 包通过自动安装、版本、内置语音运行时及窗口启动检查，真实音频设备仍需在目标电脑验收。

          桌面应用需连接匹配的后端，并配置账号、数据库与模型服务；不附带服务密钥或模型额度。源码采用 MIT，第三方模型及素材保留各自许可。
          NOTES
            gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Rewick ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
