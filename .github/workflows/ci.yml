name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
  admin:
    name: Admin tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm --prefix admin ci
      - run: npm --prefix admin test
      - run: npm --prefix admin run build
  windows:
    name: Windows desktop tests and build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - name: Verify bundled Windows speech runtime
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:PATH"
          npm --prefix frontend run prepare:recording -- win x64
          if ($LASTEXITCODE -ne 0) { throw 'Speech runtime preparation failed' }
          $lock = Get-Content frontend/scripts/recording-asr-wheels.json -Raw | ConvertFrom-Json
          $env:EXPECTED_CT2 = ($lock.'win-x64' | Where-Object name -eq 'ctranslate2').version
          & ./frontend/build/python-runtime/python/python.exe -c 'import os, faster_whisper, ctranslate2; assert ctranslate2.__version__ == os.environ["EXPECTED_CT2"]'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Windows speech runtime failed' }
  backend:
    name: Backend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: node scripts/backend.mjs --batch-mode verify
