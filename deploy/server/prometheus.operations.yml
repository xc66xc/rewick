global:
  scrape_interval: 15s
  scrape_timeout: 3s
  evaluation_interval: 30s
scrape_configs:
  - job_name: copilot-backend
    metrics_path: /actuator/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    follow_redirects: false
    sample_limit: 10000
    label_limit: 12
    label_name_length_limit: 80
    label_value_length_limit: 200
    static_configs:
      - targets: ['backend:9091']
  - job_name: operations-prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
