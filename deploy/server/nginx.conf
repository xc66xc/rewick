log_format history_transfer 'history method=$request_method status=$status bytes=$body_bytes_sent elapsed=$request_time upstream_elapsed=$upstream_response_time gzip=$gzip_ratio';
log_format payment_notify_safe 'payment_notify method=$request_method path=$uri status=$status upstream_status=$upstream_status elapsed=$request_time upstream_elapsed=$upstream_response_time';

map $http_upgrade $copilot_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /actuator/health {
        proxy_pass http://backend:8080;
    }
    location ~ ^/api/v1/admin/client-downloads/[^/]+/upload$ {
        client_max_body_size 501m;
        client_body_timeout 600s;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # History details contain large JSON documents; compress only this non-streaming API.
    location /api/v1/session-records {
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_proxied any;
        access_log /dev/stdout history_transfer;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 60s;
        client_max_body_size 11m;
    }
    # Offline review uploads text only; audio recognition runs locally.
    location /api/v1/recording-reviews/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;
        proxy_cache off;
        client_max_body_size 1m;
    }
    # Dedicated authenticated audio channel for AI mock interviews.
    location /ws/v1/mock-interviews/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $copilot_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        client_max_body_size 128k;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This is the public edge: discard client-supplied forwarded IPs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $copilot_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        client_max_body_size 11m;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name junshi.icu www.junshi.icu;
    return 308 https://junshi.icu$request_uri;
}

# Main domain is reserved for the public landing page, never the admin SPA.
server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/junshi.icu_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/junshi.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LandingTLS:10m;
    ssl_session_timeout 1d;
    server_name junshi.icu www.junshi.icu;
    server_tokens off;
    root /usr/share/nginx/landing;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aDXzsSUE0y6Bezd2vIiXMdOjm/1TeRjIgWLzWTzKg5w=' 'sha256-SXmVN0jNCvVHi41xyHe4hdWtMfARgAUne1uB3kYANHU=' 'sha256-DVluHXGKO827BkrLg9Jj8bDZPzfScJfMkM77SSgWkTo='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location = /payment/result {
        try_files /payment/result.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }
    location = /api/v1/client-downloads {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /downloads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /_client_files/ {
        internal;
        alias /usr/share/nginx/client-downloads/;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

