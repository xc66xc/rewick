map $http_upgrade $copilot_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /actuator/health {
        proxy_pass http://backend:8080;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This is the public edge: discard client-supplied forwarded IPs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $copilot_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        client_max_body_size 11m;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Main domain is reserved for the public landing page, never the admin SPA.
server {
    listen 80;
    server_name junshi.icu www.junshi.icu;
    server_tokens off;
    root /usr/share/nginx/landing;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    location / {
        try_files $uri $uri/ =404;
    }
}

# Only the admin domain redirects; the existing IP:8080 entry remains available.
server {
    listen 80;
    server_name admin.junshi.icu;
    return 308 https://admin.junshi.icu$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 404;
}

server {
    listen 443 ssl;
    server_name admin.junshi.icu;
    # Also guard HTTP Host after TLS (including reused connections).
    if ($host != admin.junshi.icu) { return 404; }
    ssl_certificate /etc/nginx/certs/admin.junshi.icu_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/admin.junshi.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AdminTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /actuator/health {
        proxy_pass http://backend:8080;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This is the public edge: discard client-supplied forwarded IPs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $copilot_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        client_max_body_size 11m;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Public desktop API, isolated from the admin SPA.
server {
    listen 80;
    server_name api.junshi.icu;
    return 426;
}

server {
    listen 443 ssl;
    server_name api.junshi.icu;
    if ($host != api.junshi.icu) { return 404; }
    ssl_certificate /etc/nginx/certs/api.junshi.icu_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/api.junshi.icu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ApiTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    location = /actuator/health { proxy_pass http://backend:8080; }
    location ^~ /api/v1/admin/ { return 404; }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $copilot_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        client_max_body_size 11m;
    }
    location / { return 404; }
}
